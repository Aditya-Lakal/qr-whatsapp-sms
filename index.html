<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact via WhatsApp or SMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <h2>Opening WhatsApp...</h2>
            <p class="countdown">Redirecting to SMS in <span id="countdown">10</span> seconds if WhatsApp doesn't open
            </p>
        </div>

        <div class="fallback hidden" id="fallback">
            <div class="icon">📄</div>
            <h2>Send Brochure</h2>
            <p>Click below to send the brochure via WhatsApp:</p>

            <!-- Primary Action: WhatsApp (Msg + PDF) -->
            <button class="btn btn-whatsapp" onclick="shareBrochure()">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor"
                        d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.66 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z" />
                </svg>
                WhatsApp (Message + PDF)
            </button>

            <div style="margin-top: 15px;"></div>

            <!-- Secondary Action: SMS (Msg only) -->
            <button class="btn btn-outline" onclick="openSMS()" style="width: 100%;">
                <svg viewBox="0 0 24 24" width="24" height="24" style="vertical-align: middle; margin-right: 8px;">
                    <path fill="currentColor"
                        d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM9 11H7V9h2v2zm4 0h-2V9h2v2zm4 0h-2V9h2v2z" />
                </svg>
                SMS (Message Only)
            </button>

            <div class="manual-options">
                <p class="contact-info" id="phoneNumber"></p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
